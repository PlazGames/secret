<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spoinky-Doinky Menu</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#111,#1d1d2b,#111);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.menu{
    width:420px;
    padding:40px;
    background:rgba(25,25,35,.95);
    border:3px solid #66ccff;
    border-radius:18px;
    box-shadow:0 0 30px #00aaff88;
    text-align:center;
    color:white;
}

h1{
    margin-top:0;
    font-size:34px;
    color:#66ccff;
    text-shadow:0 0 12px #00aaff;
}

p{
    font-size:22px;
    margin:30px 0 15px;
}

input{
    width:90%;
    padding:14px;
    font-size:20px;
    border:none;
    border-radius:10px;
    outline:none;
    text-align:center;
    background:#2a2a3d;
    color:white;
    box-shadow:0 0 10px #000 inset;
}

button{
    margin-top:25px;
    width:95%;
    padding:14px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#00aaff;
    color:white;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
    background:#33bbff;
    box-shadow:0 0 15px #00aaff;
}
</style>
</head>

<body>

<div class="menu">
    <h1>🎮 Secret Menu</h1>

    <p>Enter the spoinky-doinky code!</p>

    <input
        type="text"
        id="code"
        placeholder="Type the code here..."
        autocomplete="off"
    >

    <button onclick="submitCode()">Continue</button>
</div>

<script>
const SECRET_CODE = "khuljasimsim";

const codeInput = document.getElementById("code");

function submitCode() {
    const enteredCode = codeInput.value.trim();

    if (enteredCode === SECRET_CODE) {
        window.location.href = "secret.html";
    } else {
        alert("Wrong spoinky-doinky code!");
        codeInput.value = "";
        codeInput.focus();
    }
}

codeInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        submitCode();
    }
});

window.onload = function() {
    codeInput.focus();
};
</script>

</body>
</html>
