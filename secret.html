<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 Upload Menu</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#111,#1d1d2b,#111);
    font-family:Arial,sans-serif;
    color:white;
}

.menu{
    width:80%;
    max-width:700px;
    margin:40px auto;
    padding:40px;
    background:rgba(25,25,35,.95);
    border:3px solid #66ccff;
    border-radius:18px;
    box-shadow:0 0 30px #00aaff88;
    text-align:center;
}

h1{
    color:#66ccff;
    text-shadow:0 0 12px #00aaff;
}

.upload-btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 35px;
    background:#00aaff;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
    font-weight:bold;
    transition:.2s;
}

.upload-btn:hover{
    transform:scale(1.05);
    background:#33bbff;
}

input{
    display:none;
}

.section{
    width:80%;
    max-width:700px;
    margin:30px auto;
    padding:20px;
    background:rgba(25,25,35,.95);
    border:3px solid #66ccff;
    border-radius:18px;
    box-shadow:0 0 30px #00aaff55;
}

.section h2{
    text-align:center;
}

#videos{
    display:flex;
    flex-direction:column;
    gap:20px;
    max-height:500px;
    overflow-y:auto;
    padding-right:10px;
}

.video-card{
    background:#202030;
    padding:15px;
    border-radius:10px;
}

video{
    width:100%;
    border-radius:10px;
}

.name{
    margin-bottom:10px;
    font-weight:bold;
    color:#66ccff;
}
</style>
</head>
<body>

<div class="menu">
    <h1>🎥 MP4 Upload Menu</h1>

    <label class="upload-btn">
        Upload MP4
        <input id="upload" type="file" accept="video/mp4" multiple>
    </label>

    <p>Scroll down to see your uploaded MP4s.</p>
</div>

<div class="section">
    <h2>Current Uploaded MP4s</h2>

    <div id="videos"></div>
</div>

<script>
const upload=document.getElementById("upload");
const videos=document.getElementById("videos");

upload.addEventListener("change",function(){

    for(const file of this.files){

        const card=document.createElement("div");
        card.className="video-card";

        const name=document.createElement("div");
        name.className="name";
        name.textContent=file.name;

        const video=document.createElement("video");
        video.controls=true;
        video.src=URL.createObjectURL(file);

        card.appendChild(name);
        card.appendChild(video);

        videos.appendChild(card);
    }

    upload.value="";
});
</script>

</body>
</html>
